
name: Build gallery

on:
  push:
    branches:
      - main
    paths:
      - 'content/galerija/**'
      - 'build-gallery.py'
      - '.github/workflows/build-gallery.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gallery-build
  cancel-in-progress: false

jobs:
  build-gallery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate and commit gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B main origin/main

            python build-gallery.py
            git add content/galerija-visi.json

            if git diff --cached --quiet; then
              echo "Gallery is already up to date."
              exit 0
            fi

            git commit -m "Automatinis galerijos atnaujinimas"

            if git push origin HEAD:main; then
              echo "Gallery updated successfully."
              exit 0
            fi

            echo "Remote changed. Retrying..."
            sleep 2
          done

          echo "Could not update gallery after 5 attempts."
          exit 1
