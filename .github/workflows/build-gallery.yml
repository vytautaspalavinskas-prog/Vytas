
name: Build gallery

on:
  push:
    branches:
      - main
    paths:
      - 'content/galerija/**'
      - 'build-gallery.py'
      - '.github/workflows/build-gallery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gallery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate gallery JSON
        run: python build-gallery.py

      - name: Commit gallery changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/galerija-visi.json
          if ! git diff --cached --quiet; then
            git commit -m "Automatinis galerijos atnaujinimas"
            git push
          fi
